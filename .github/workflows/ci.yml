name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/governance/bootstrap_github.py validate-pr-title --title "$PR_TITLE"

  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Run the pinned central CI harness
        uses: jarlor/fastapi-vue-harness@1b1695414cb10406f09617efab88794d89f0c1dc

  required:
    name: required
    if: always()
    needs:
      - pr-title
      - quality
    runs-on: ubuntu-latest
    steps:
      - name: Resolve required result
        env:
          PR_TITLE_RESULT: ${{ needs.pr-title.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          set -euo pipefail

          if [[ "$QUALITY_RESULT" != "success" ]]; then
            echo "Quality gate did not pass: $QUALITY_RESULT" >&2
            exit 1
          fi

          if [[ "$PR_TITLE_RESULT" != "success" && "$PR_TITLE_RESULT" != "skipped" ]]; then
            echo "PR title gate did not pass: $PR_TITLE_RESULT" >&2
            exit 1
          fi

          echo "All required checks passed."
