default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        stages: [pre-commit]
      - id: lint
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        stages: [pre-commit]
      - id: protect-main-push
        name: keep main changes behind a pull request
        entry: uv run python scripts/governance/check_push_policy.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
