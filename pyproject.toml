[project]
name = "app_name"
version = "1.0.0"
description = "A FastAPI + Vue3 application"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.2",
]

# ---------------------------------------------------------------------------
# Dependency Groups (PEP 735) — uv native
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "poethepoet>=0.42",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "ruff>=0.11",
    "pre-commit>=4.0",
    "python-semantic-release>=9.0",
    "copier>=9.15.0",
]

# ---------------------------------------------------------------------------
# Build System
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------------------
# Poe Tasks
# ---------------------------------------------------------------------------
[tool.poe.tasks]
api = "python -m app.run_api"
frontend = { cmd = "npm run dev", cwd = "src/frontend" }
lint = "ruff check src/app scripts tests harness_tests"
fmt = "ruff format src/app scripts tests harness_tests"
format-check = "ruff format --check src/app scripts tests harness_tests"
test-fast = "python -m pytest tests/ -q"
test = "python -m pytest tests/ -v --cov=src/app --cov-report=term-missing --cov-fail-under=80"
harness-test = "python -m pytest harness_tests/ -v"
supply-chain = "python scripts/harness/check_supply_chain_baseline.py"
architecture = "python scripts/harness/check_context_boundaries.py"
security = "python scripts/harness/check_security_baseline.py"
api-contracts = "python scripts/harness/check_api_contracts.py"
api-contracts-write = "python scripts/harness/check_api_contracts.py --write"
frontend-harness = "node scripts/harness/check_frontend_boundaries.mjs"
frontend-build = { cmd = "npm run build", cwd = "src/frontend" }
frontend-test = { cmd = "npm run test", cwd = "src/frontend" }
repo-bootstrap = "python scripts/governance/bootstrap_github.py"
check = [
    "format-check",
    "lint",
    "harness-test",
    "supply-chain",
    "architecture",
    "security",
    "frontend-harness",
    "test-fast",
    "frontend-build",
    "frontend-test",
]
harness = [
    "format-check",
    "lint",
    "harness-test",
    "supply-chain",
    "architecture",
    "security",
    "api-contracts",
    "frontend-harness",
    "test",
    "frontend-build",
    "frontend-test",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"harness_tests/**/*.py" = ["S101", "S603", "S607"]
"src/app/config.py" = ["S104"]
"scripts/harness/check_api_contracts.py" = ["S603"]
"scripts/harness/check_security_baseline.py" = ["S607"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
